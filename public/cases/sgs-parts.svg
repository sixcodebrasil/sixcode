<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04122e"/>
      <stop offset="1" stop-color="#020815"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- White background base -->
  <rect width="1000" height="720" fill="#ffffff"/>

  <!-- Top promo strip (dark blue) -->
  <rect width="1000" height="36" fill="#0b1f48"/>
  <text x="60" y="22" fill="#dbe5ff" font-family="system-ui,sans-serif" font-size="11" font-weight="700">PAGUE À VISTA E ECONOMIZE</text>
  <text x="320" y="22" fill="#ffffff" font-family="system-ui,sans-serif" font-size="11" font-weight="700">PARCELE NO CARTÃO DE CRÉDITO</text>
  <text x="600" y="22" fill="#dbe5ff" font-family="system-ui,sans-serif" font-size="11" font-weight="700">ENTREGA RÁPIDA PARA TODO O BRASIL</text>
  <text x="900" y="22" fill="#dbe5ff" font-family="system-ui,sans-serif" font-size="11">@sgspartsrs</text>

  <!-- Header (white) -->
  <g transform="translate(0,36)">
    <rect width="1000" height="88" fill="#ffffff"/>
    <!-- SGS PARTS logo (circular blue with snowflake) -->
    <circle cx="80" cy="44" r="32" fill="#0b1f48" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="80" y="40" fill="#ffffff" font-family="system-ui,sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1">SGS</text>
    <text x="80" y="55" fill="#7aa8ff" font-family="system-ui,sans-serif" font-size="9" font-weight="700" text-anchor="middle">PARTS</text>
    <!-- Search -->
    <rect x="200" y="22" width="430" height="44" rx="22" fill="#f6f7fb" stroke="#dadeea"/>
    <text x="226" y="50" fill="#8a92a8" font-family="system-ui,sans-serif" font-size="13">O que você está procurando?</text>
    <!-- Search btn -->
    <rect x="586" y="26" width="40" height="36" rx="6" fill="url(#btn)"/>
    <circle cx="603" cy="42" r="6" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <line x1="607" y1="46" x2="612" y2="51" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Account -->
    <text x="680" y="38" fill="#0b1f48" font-family="system-ui,sans-serif" font-size="11">Minha</text>
    <text x="680" y="54" fill="#0b1f48" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Conta</text>
    <!-- Cart -->
    <text x="800" y="38" fill="#0b1f48" font-family="system-ui,sans-serif" font-size="11">Meu</text>
    <text x="800" y="54" fill="#0b1f48" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Carrinho</text>
    <circle cx="844" cy="32" r="8" fill="#dc2626"/>
    <text x="844" y="36" fill="#ffffff" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">1</text>
  </g>

  <!-- Category nav (white) -->
  <g transform="translate(0,124)">
    <rect width="1000" height="48" fill="#ffffff"/>
    <line x1="0" y1="47" x2="1000" y2="47" stroke="#e6e9f2"/>
    <text x="60" y="30" fill="#0b1f48" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Todos</text>
    <text x="120" y="30" fill="#5a6584" font-family="system-ui,sans-serif" font-size="12" font-weight="700">LAVADORAS DE ROUPAS ▾</text>
    <text x="340" y="30" fill="#5a6584" font-family="system-ui,sans-serif" font-size="12" font-weight="700">REFRIGERADORES ▾</text>
    <text x="510" y="30" fill="#5a6584" font-family="system-ui,sans-serif" font-size="12" font-weight="700">FERRAMENTAS ▾</text>
    <text x="640" y="30" fill="#5a6584" font-family="system-ui,sans-serif" font-size="12" font-weight="700">ASPIRADOR DE PÓ ▾</text>
    <text x="790" y="30" fill="#5a6584" font-family="system-ui,sans-serif" font-size="12" font-weight="700">AR CONDICIONADO ▾</text>
  </g>

  <!-- Big Panasonic banner -->
  <g transform="translate(0,172)">
    <rect width="1000" height="328" fill="url(#hero)"/>
    <!-- Light streaks -->
    <path d="M 50 280 Q 200 240 350 280 T 700 280" stroke="url(#streak)" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M 900 200 Q 800 240 700 220" stroke="url(#streak)" stroke-width="3" fill="none"/>
    <!-- Tiny dots pattern -->
    <g fill="#1d4ed8" opacity="0.25">
      <circle cx="60" cy="60" r="1.5"/><circle cx="80" cy="50" r="1.5"/><circle cx="100" cy="70" r="1.5"/>
      <circle cx="120" cy="55" r="1.5"/><circle cx="140" cy="62" r="1.5"/><circle cx="160" cy="50" r="1.5"/>
    </g>

    <text x="60" y="70" fill="#3b82f6" font-family="system-ui,sans-serif" font-size="22" font-weight="800" letter-spacing="3">DISTRIBUIDOR OFICIAL</text>
    <text x="60" y="170" fill="#ffffff" font-family="system-ui,sans-serif" font-size="98" font-weight="900" letter-spacing="-2">Panasonic</text>

    <!-- CTA strip -->
    <rect x="60" y="200" width="880" height="64" rx="14" fill="#04122e" stroke="#1d4ed8"/>
    <circle cx="98" cy="232" r="18" fill="url(#btn)"/>
    <text x="98" y="237" fill="#ffffff" font-family="system-ui,sans-serif" font-size="18" font-weight="700" text-anchor="middle">⚙</text>
    <text x="140" y="240" fill="#ffffff" font-family="system-ui,sans-serif" font-size="20" font-weight="500">Clique e confira nossas peças <tspan fill="#3b82f6" font-weight="800">Panasonic</tspan></text>
    <text x="906" y="245" fill="#3b82f6" font-family="system-ui,sans-serif" font-size="22" font-weight="700">›</text>

    <!-- Carousel arrows -->
    <circle cx="34" cy="200" r="14" fill="#1d4ed8" opacity="0.85"/>
    <text x="34" y="206" fill="#ffffff" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle">‹</text>
    <circle cx="966" cy="200" r="14" fill="#1d4ed8" opacity="0.85"/>
    <text x="966" y="206" fill="#ffffff" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle">›</text>

    <!-- Three benefit cards -->
    <g transform="translate(60,280)">
      <rect width="285" height="48" rx="12" fill="#04122e" stroke="#1d4ed8"/>
      <circle cx="32" cy="24" r="14" fill="none" stroke="#3b82f6" stroke-width="1.8"/>
      <text x="32" y="29" fill="#3b82f6" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">✓</text>
      <text x="62" y="22" fill="#ffffff" font-family="system-ui,sans-serif" font-size="12" font-weight="800">PEÇAS ORIGINAIS</text>
      <text x="62" y="38" fill="#8aa3d6" font-family="system-ui,sans-serif" font-size="10">Garantia de qualidade</text>
    </g>
    <g transform="translate(355,280)">
      <rect width="285" height="48" rx="12" fill="#04122e" stroke="#1d4ed8"/>
      <circle cx="32" cy="24" r="14" fill="none" stroke="#3b82f6" stroke-width="1.8"/>
      <text x="32" y="29" fill="#3b82f6" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">⏱</text>
      <text x="62" y="22" fill="#ffffff" font-family="system-ui,sans-serif" font-size="12" font-weight="800">ENTREGA RÁPIDA</text>
      <text x="62" y="38" fill="#8aa3d6" font-family="system-ui,sans-serif" font-size="10">Agilidade para todo o Brasil</text>
    </g>
    <g transform="translate(650,280)">
      <rect width="290" height="48" rx="12" fill="#04122e" stroke="#1d4ed8"/>
      <circle cx="32" cy="24" r="14" fill="none" stroke="#3b82f6" stroke-width="1.8"/>
      <text x="32" y="29" fill="#3b82f6" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">★</text>
      <text x="62" y="22" fill="#ffffff" font-family="system-ui,sans-serif" font-size="12" font-weight="800">MARCAS DE CONFIANÇA</text>
      <text x="62" y="38" fill="#8aa3d6" font-family="system-ui,sans-serif" font-size="10">Melhores do mercado</text>
    </g>
  </g>

  <!-- ESCOLHA POR CATEGORIA section -->
  <g transform="translate(0,520)">
    <text x="60" y="20" fill="#3a4263" font-family="system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="2">ESCOLHA POR CATEGORIA</text>
    <!-- Category cards -->
    <g transform="translate(60,40)">
      <rect width="140" height="100" rx="12" fill="#eef3ff" stroke="#1d4ed8" stroke-width="2"/>
      <text x="70" y="46" fill="#0b1f48" font-family="system-ui,sans-serif" font-size="20" font-weight="700" text-anchor="middle">▥</text>
      <text x="70" y="78" fill="#0b1f48" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">Todos</text>
    </g>
    <g transform="translate(216,40)">
      <rect width="140" height="100" rx="12" fill="#ffffff" stroke="#dde3f1"/>
      <text x="70" y="48" fill="#5a6584" font-family="system-ui,sans-serif" font-size="22" text-anchor="middle">⊞</text>
      <text x="70" y="74" fill="#0b1f48" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">LAVADORAS DE</text>
      <text x="70" y="86" fill="#0b1f48" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">ROUPAS</text>
    </g>
    <g transform="translate(372,40)">
      <rect width="140" height="100" rx="12" fill="#ffffff" stroke="#dde3f1"/>
      <text x="70" y="48" fill="#5a6584" font-family="system-ui,sans-serif" font-size="22" text-anchor="middle">❄</text>
      <text x="70" y="82" fill="#0b1f48" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">REFRIGERADORES</text>
    </g>
    <g transform="translate(528,40)">
      <rect width="140" height="100" rx="12" fill="#ffffff" stroke="#dde3f1"/>
      <text x="70" y="48" fill="#5a6584" font-family="system-ui,sans-serif" font-size="22" text-anchor="middle">⚒</text>
      <text x="70" y="82" fill="#0b1f48" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">FERRAMENTAS</text>
    </g>
    <g transform="translate(684,40)">
      <rect width="140" height="100" rx="12" fill="#ffffff" stroke="#dde3f1"/>
      <text x="70" y="48" fill="#5a6584" font-family="system-ui,sans-serif" font-size="22" text-anchor="middle">▮</text>
      <text x="70" y="82" fill="#0b1f48" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">ASPIRADOR DE PÓ</text>
    </g>
    <g transform="translate(840,40)">
      <rect width="140" height="100" rx="12" fill="#ffffff" stroke="#dde3f1"/>
      <text x="70" y="48" fill="#5a6584" font-family="system-ui,sans-serif" font-size="22" text-anchor="middle">▭</text>
      <text x="70" y="76" fill="#0b1f48" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">AR</text>
      <text x="70" y="88" fill="#0b1f48" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">CONDICIONADO</text>
    </g>
    <!-- Carousel arrows -->
    <circle cx="24" cy="90" r="18" fill="url(#btn)"/>
    <text x="24" y="97" fill="#ffffff" font-family="system-ui,sans-serif" font-size="18" font-weight="700" text-anchor="middle">‹</text>
    <circle cx="976" cy="90" r="18" fill="url(#btn)"/>
    <text x="976" y="97" fill="#ffffff" font-family="system-ui,sans-serif" font-size="18" font-weight="700" text-anchor="middle">›</text>
  </g>

  <!-- Em Promoção label -->
  <g transform="translate(60,680)">
    <text x="0" y="0" fill="#0b1f48" font-family="system-ui,sans-serif" font-size="18" font-weight="900">Em Promoção</text>
    <rect x="120" y="-14" width="76" height="20" rx="10" fill="#1d4ed8"/>
    <text x="158" y="0" fill="#ffffff" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">20 ofertas</text>
  </g>

  <!-- WhatsApp floating btn -->
  <circle cx="920" cy="680" r="22" fill="#22c55e"/>
  <text x="920" y="687" fill="#ffffff" font-family="system-ui,sans-serif" font-size="20" font-weight="700" text-anchor="middle">💬</text>
</svg>
