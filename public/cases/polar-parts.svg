<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1f55"/>
      <stop offset="1" stop-color="#06143a"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#173089"/>
    </linearGradient>
  </defs>

  <!-- Right side: dark blue gradient -->
  <rect width="1000" height="720" fill="url(#bg)"/>

  <!-- Left sidebar: white -->
  <rect width="380" height="720" fill="#fefefe"/>
  <line x1="380" y1="0" x2="380" y2="720" stroke="#0a1f55" stroke-width="0.5" opacity="0.2"/>

  <!-- POLAR logo + brand -->
  <g transform="translate(100,100)">
    <!-- Polar bear icon (stylized) -->
    <circle cx="90" cy="0" r="32" fill="#0a1f55"/>
    <circle cx="78" cy="-12" r="6" fill="#0a1f55"/>
    <circle cx="102" cy="-12" r="6" fill="#0a1f55"/>
    <text x="90" y="58" fill="#0a1f55" font-family="system-ui,sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="3">POLAR</text>
    <text x="90" y="120" fill="#0a1f55" font-family="system-ui,sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="3">POLAR PARTS</text>
    <text x="90" y="142" fill="#7a86a6" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="2">AUTOMATIZAÇÃO DE ESTOQUE</text>
  </g>

  <!-- Login card -->
  <g transform="translate(60,290)">
    <rect width="260" height="260" rx="12" fill="#f9faff" stroke="#e3e7f2"/>
    <text x="20" y="34" fill="#0a1f55" font-family="system-ui,sans-serif" font-size="14" font-weight="800">Bem-vindo de volta</text>
    <text x="20" y="54" fill="#7a86a6" font-family="system-ui,sans-serif" font-size="11">Acesse o painel de gestão de estoque</text>

    <text x="20" y="92" fill="#0a1f55" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Usuário</text>
    <rect x="20" y="100" width="220" height="38" rx="6" fill="#ffffff" stroke="#dde3f1"/>
    <text x="36" y="124" fill="#aab3cc" font-family="system-ui,sans-serif" font-size="11">👤  seu.usuario</text>

    <text x="20" y="158" fill="#0a1f55" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Senha</text>
    <rect x="20" y="166" width="220" height="38" rx="6" fill="#ffffff" stroke="#dde3f1"/>
    <text x="36" y="190" fill="#aab3cc" font-family="system-ui,sans-serif" font-size="11">🔒  ••••••••</text>
    <text x="226" y="190" fill="#7a86a6" font-family="system-ui,sans-serif" font-size="12">👁</text>

    <rect x="20" y="216" width="220" height="34" rx="6" fill="url(#btn)"/>
    <text x="130" y="239" fill="#ffffff" font-family="system-ui,sans-serif" font-size="13" font-weight="800" text-anchor="middle">Entrar</text>
  </g>

  <!-- Sidebar footer -->
  <g transform="translate(190,648)">
    <text x="0" y="0" fill="#0a1f55" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">Polar Peças <tspan fill="#7a86a6" font-weight="400">— Sistema interno de gestão</tspan></text>
    <text x="0" y="16" fill="#7a86a6" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">Todos os direitos reservados © 2026</text>
  </g>

  <!-- Right side content -->
  <g transform="translate(540,260)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui,sans-serif" font-size="32" font-weight="900">Controle total do seu</text>
    <text x="0" y="42" fill="#7aa8ff" font-family="system-ui,sans-serif" font-size="32" font-weight="900">estoque<tspan fill="#ffffff">, de forma</tspan></text>
    <text x="0" y="84" fill="#ffffff" font-family="system-ui,sans-serif" font-size="32" font-weight="900">inteligente</text>

    <text x="0" y="124" fill="#cfd8ff" font-family="system-ui,sans-serif" font-size="14">Atualize seu estoque do SAAS para a Seconds e</text>
    <text x="0" y="142" fill="#cfd8ff" font-family="system-ui,sans-serif" font-size="14">Mercado Livre.</text>

    <!-- Feature 1 -->
    <g transform="translate(0,180)">
      <rect width="40" height="40" rx="8" fill="#1f3da8"/>
      <text x="20" y="29" fill="#ffe082" font-family="system-ui,sans-serif" font-size="22" font-weight="700" text-anchor="middle">⚡</text>
      <text x="56" y="18" fill="#ffffff" font-family="system-ui,sans-serif" font-size="13" font-weight="800">Atualização automática</text>
      <text x="56" y="36" fill="#9bb1e8" font-family="system-ui,sans-serif" font-size="11">Importe o estoque e gere a planilha atualizada em um clique</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(0,236)">
      <rect width="40" height="40" rx="8" fill="#1f3da8"/>
      <text x="20" y="29" fill="#cab8ff" font-family="system-ui,sans-serif" font-size="22" font-weight="700" text-anchor="middle">+</text>
      <text x="56" y="18" fill="#ffffff" font-family="system-ui,sans-serif" font-size="13" font-weight="800">Cadastro de novos produtos</text>
      <text x="56" y="36" fill="#9bb1e8" font-family="system-ui,sans-serif" font-size="11">Adicione peças e exporte direto no formato correto</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(0,292)">
      <rect width="40" height="40" rx="8" fill="#1f3da8"/>
      <text x="20" y="30" fill="#a8d4ff" font-family="system-ui,sans-serif" font-size="22" font-weight="700" text-anchor="middle">▦</text>
      <text x="56" y="18" fill="#ffffff" font-family="system-ui,sans-serif" font-size="13" font-weight="800">Exportação formatada</text>
      <text x="56" y="36" fill="#9bb1e8" font-family="system-ui,sans-serif" font-size="11">Planilhas prontas para importar no Mercado Livre, sem ajustes manuais</text>
    </g>
  </g>
</svg>
